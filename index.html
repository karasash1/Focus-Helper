<!DOCTYPE html>
<html lang="en">
<head>
  <meta charest="UTF-8" />
  <meta name="viewpart" content="width=device-width, initial-scale=1.0" />
  <title>Focus & Tracs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- تايمر البومودوروو-->
     <div class="card timer-card">
    <h2>Pomodoro Timer</h2>
    <div class="timer-controls">
      <button id="minusBtn" class="side-btn">-</button>
      <div id="timerDisplay" class="timer-display">25:00</div>
      <button id="plusBtn" class="side-btn">+</button>
    </div>
    <div class="timer-buttons">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
  </div>
</div>
<!--الكارتتت-->
<div class="card todo-card">
  <h2>Today's Tasks</h2>
  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Write a new task..." />
    <button id="addTaskBtn" >Add</button>
  </div>
  <p id="Continue"></p>
  <ul id="taskList"></ul>
 </div>
</div>
<script src="script.js"></script>
</body>
</html>
